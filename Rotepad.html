<body>
<header><div class="brand"><span class="logo" aria-hidden="true">r</span>Rotepad</div><span class="divider"></span><input id="filename" aria-label="File name" value="Untitled.md" spellcheck="false"><div class="file-actions"><button id="new" title="New note">New</button><button id="open">Open</button><button id="save" class="primary" title="Save Markdown file (Ctrl+S)">Save .md</button></div></header>
<div class="toolbar" aria-label="Editor toolbar">
<div class="group"><label for="font">Font</label><select id="font"><option value="Consolas">Consolas</option><option value="Arial">Arial</option><option value="Calibri">Calibri</option><option value="Georgia">Georgia</option><option value="Times New Roman">Times New Roman</option><option value="Courier New">Courier New</option></select><select id="size" aria-label="Font size"><option>12</option><option>14</option><option selected>16</option><option>18</option><option>20</option></select></div>
<span class="divider"></span><div class="group format"><button data-format="bold" title="Bold (Ctrl+B)" aria-label="Bold"><b>B</b></button><button data-format="italic" title="Italic (Ctrl+I)" aria-label="Italic"><i>I</i></button><button data-format="underline" title="Underline (Ctrl+U)" aria-label="Underline"><u>U</u></button><button data-format="quote" title="Turn selected text into a quote block" aria-label="Quote block">❝ Quote</button><button data-format="heading" title="Heading" aria-label="Heading">H</button><button data-format="list" title="Bullet list" aria-label="Bullet list">☷</button><button data-format="code" title="Inline code" aria-label="Inline code">&lt;/&gt;</button><button id="link" title="Insert website link (Ctrl+K)">Link ↗</button></div>
<div class="group views" aria-label="View"><button data-mode="rich" aria-pressed="true" title="Edit with formatting visible">Write</button><button data-mode="write" aria-pressed="false" title="Edit Markdown source">Markdown</button><button data-mode="split" aria-pressed="false">Split</button><button data-mode="preview" aria-pressed="false">Preview</button></div>
</div>
<main class="workspace" data-mode="write"><section class="pane" id="write-pane" aria-label="Markdown editor"><div class="pane-label"><span>Markdown</span><span>Plain text. Room to think.</span></div><textarea id="editor" aria-label="Write Markdown" placeholder="Start writing…" spellcheck="true"></textarea></section><section class="pane" id="preview-pane" aria-label="Formatted preview"><div class="pane-label"><span>Preview</span><span>Links open in a new tab</span></div><article id="preview" class="preview"></article></section></main>
<footer><span id="count">0 words · 0 characters</span><span id="position">Ln 1, Col 1</span><span id="save-status" role="status">Ready</span></footer>
<div class="help">Markdown basics: <b>**bold**</b> &nbsp; <i>*italic*</i> &nbsp; # heading &nbsp; - list &nbsp; [text](https://example.com)</div>
<input type="file" id="file-input" accept=".md,.markdown,.txt,text/plain,text/markdown" hidden>
<dialog id="link-dialog"><form id="link-form"><h2>Insert a link</h2><label for="link-text">Text</label><input id="link-text" placeholder="Website name"><label for="link-url">Website URL</label><input id="link-url" type="url" placeholder="https://example.com" required><p id="link-error" role="alert"></p><div class="actions"><button type="button" id="cancel-link">Cancel</button><button class="primary" type="submit">Insert link</button></div></form></dialog>
<script>
'use strict';
let appReady=false;
const $=id=>document.getElementById(id),editor=$('editor'),preview=$('preview'),filename=$('filename');
const writingArea=document.createElement('div'),linkLayer=document.createElement('div');
writingArea.className='writing-area';linkLayer.className='link-layer';linkLayer.setAttribute('aria-hidden','true');editor.before(writingArea);writingArea.append(editor,linkLayer);
document.querySelector('#write-pane .pane-label span:last-child').textContent='Ctrl+click a link to open';
function syncLinks(){linkLayer.style.width=editor.clientWidth+'px';linkLayer.scrollTop=editor.scrollTop;linkLayer.scrollLeft=editor.scrollLeft}
editor.addEventListener('scroll',syncLinks);new ResizeObserver(syncLinks).observe(editor);
document.addEventListener('keydown',e=>writingArea.classList.toggle('follow-links',e.ctrlKey||e.metaKey));
document.addEventListener('keyup',e=>writingArea.classList.toggle('follow-links',e.ctrlKey||e.metaKey));
window.addEventListener('blur',()=>writingArea.classList.remove('follow-links'));
const richPane=document.createElement('section');richPane.id='rich-pane';richPane.className='pane';richPane.setAttribute('aria-label','Formatted editor');richPane.innerHTML='<div class="pane-label"><span>Write</span><span>Format as you type · Ctrl+click links</span></div><div id="rich-editor" class="preview" contenteditable="true" role="textbox" aria-label="Write your note" aria-multiline="true" spellcheck="true"></div>';document.querySelector('.workspace').prepend(richPane);
const rich=$('rich-editor');let richRange=null,richHistory=[],historyIndex=-1,composing=false;
const key='rotepad.draft.v1';let mode='rich',selection=[0,0],savedText='',storageOK=true;
const escapeHTML=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function safeURL(s){try{const u=new URL(s);return ['https:','http:'].includes(u.protocol)?u.href:null}catch{return null}}
function inline(s){
 let out='',i=0;
 while(i<s.length){const rest=s.slice(i);let m;
  if((m=/^[^\s<>`*]*\\\.[^\s<>`*]*/.exec(rest))){out+='<span data-no-link="true">'+escapeHTML(m[0].replace(/\\\./g,'.'))+'</span>';i+=m[0].length;continue}
  if((m=/^\\([\\`*_\[\]~])/.exec(rest))){out+=escapeHTML(m[1]);i+=m[0].length;continue}
  if((m=/^`([^`]+)`/.exec(rest))){out+='<code>'+escapeHTML(m[1])+'</code>';i+=m[0].length;continue}
  if((m=/^\[([^\]]+)\]\((https?:\/\/[^\s]+?)\)/.exec(rest))){const u=safeURL(m[2]);out+=u?'<a href="'+escapeHTML(u)+'" target="_blank" rel="noopener noreferrer">'+escapeHTML(m[1])+'</a>':escapeHTML(m[0]);i+=m[0].length;continue}
  if((m=/^\*\*(.+?)\*\*/.exec(rest))){out+='<strong>'+inline(m[1])+'</strong>';i+=m[0].length;continue}

function clearSelectedFormatting(){if(mode==='preview')return;breakTypingGroup();$('more-format').open=false;if(mode==='rich'){restoreRange();const s=getSelection();if(s.isCollapsed)return;const range=s.getRangeAt(0),start=document.createElement('span'),end=document.createElement('span');start.dataset.selectionMarker='start';end.dataset.selectionMarker='end';const tail=range.cloneRange();tail.collapse(false);tail.insertNode(end);const head=range.cloneRange();head.collapse(true);head.insertNode(start);const selected=document.createRange();selected.setStartAfter(start);selected.setEndBefore(end);for(const node of selectionTextNodes(selected))liftInlineNode(node);selected.setStartAfter(start);selected.setEndBefore(end);start.remove();end.remove();s.removeAllRanges();s.addRange(selected);rememberRange();commitRich()}else{const a=editor.selectionStart,b=editor.selectionEnd;if(a===b)return;const node=document.createElement('div');node.innerHTML=inline(editor.value.slice(a,b));insert(node.textContent,a,b)}updateFormatting()}

// Accept ordinary domains in the link dialog; normalize without permitting script URLs.
function websiteURL(input){const text=input.trim();if(!text||/\s/.test(text))return null;if(/^https?:\/\//i.test(text))return safeURL(text);if(/^[a-z][a-z0-9+.-]*:/i.test(text)||text.includes('@'))return null;if(!/^(?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.)+[a-z]{2,63}(?::\d+)?(?:[/?#][^\s]*)?$/i.test(text))return null;return safeURL('https://'+text)}

// Savepoints capture meaningful edit boundaries and completed writing chunks.
function changedCharacters(before,after){let start=0;while(start<before.length&&start<after.length&&before[start]===after[start])start++;let endBefore=before.length,endAfter=after.length;while(endBefore>start&&endAfter>start&&before[endBefore-1]===after[endAfter-1]){endBefore--;endAfter--}return {removed:endBefore-start,added:endAfter-start}}
function significantEdit(before,after){const d=changedCharacters(before,after);return d.added+d.removed>=80||(d.removed>=20&&d.removed>=before.length*.3)}
let savepointReason=null,savepointTimer=null;
function majorEditBoundary(reason){const n=activeNote();if(n){addRevision(n,editor.value,filename.value,'Before '+reason.toLowerCase());savepointReason=reason;setTimeout(()=>{if(savepointReason===reason)savepointReason=null},0)}}
const historyTimers=new Map();
function scheduleMajorSavepoint(note){if(historyTimers.has(note.id))return;const last=note.revisions.at(-1);if(last&&!significantEdit(last.text,note.text))return;const delay=Math.max(0,180000-(Date.now()-(last?.at||Date.now())));historyTimers.set(note.id,setTimeout(()=>{historyTimers.delete(note.id);const current=notes.find(n=>n.id===note.id);if(current&&addRevision(current,current.text,current.name,'Major edit'))trackedPersist()},delay))}
const trackedPersist=persistLibrary;persistLibrary=function(){const n=activeNote();const changed=n&&(n.text!==editor.value||n.name!==filename.value);trackedPersist();if(changed){scheduleMajorSavepoint(n);savepointReason=null}};
for(const surface of [rich,editor]){surface.addEventListener('beforeinput',e=>{if(['insertFromPaste','insertFromDrop','deleteByCut'].includes(e.inputType))majorEditBoundary(e.inputType==='deleteByCut'?'Cut text':'Pasted text')},true);surface.addEventListener('paste',()=>majorEditBoundary('Pasted text'),true)}
for(const [name,reason] of [['format','Formatting'],['extraFormat','Formatting'],['applyParagraphStyle','Paragraph style'],['quoteSelection','Quote block'],['clearSelectedFormatting','Clear formatting'],['replaceFound','Find and replace']]){
 // Existing listeners call these shared functions; wrap at the action boundary.

}
const historyButton=document.createElement('button');historyButton.id='history-button';historyButton.textContent='History';historyButton.title='Saved versions of this note';$('find-toggle').before(historyButton);
$('recovery-open').textContent='Note history';$('recovery-dialog').querySelector('h2').textContent='Note history';$('recovery-dialog').querySelector('.side-note').textContent='Automatic savepoints for writing sessions and major edits. The latest 25 versions are kept per note in this browser and included in backups. Downloaded Markdown files contain the current text only.';
const historyActions=document.createElement('div');historyActions.className='history-actions';historyActions.innerHTML='<button id="savepoint-now">Save point now</button><button id="history-copy" disabled>Restore as a copy</button>';$('revision-list').before(historyActions);$('restore-revision').textContent='Restore this version';
function drawHistory(){const list=$('revision-list');list.replaceChildren();selectedRevision=null;$('revision-text').textContent='Select a savepoint to preview its text.';$('restore-revision').disabled=$('history-copy').disabled=true;const entries=[...activeNote().revisions].reverse();for(const r of entries){const b=document.createElement('button');b.className='revision-row';const title=document.createElement('strong'),meta=document.createElement('span');title.textContent=r.reason||'Saved version';meta.className='history-meta';meta.textContent=new Date(r.at).toLocaleString()+' · '+r.text.length+' characters';b.append(title,meta);b.onclick=()=>{selectedRevision=r;$('revision-text').textContent=r.text;$('restore-revision').disabled=$('history-copy').disabled=false;list.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))};list.append(b)}if(!entries.length)list.textContent='Savepoints will appear as you edit.'}

function quoteLineText(node){if(node.nodeType===3)return node.data;if(node.nodeType===1&&node.dataset?.quoteCaret)return '\uE000';if(node.nodeType===1&&node.tagName==='BR')return '\n';let text=[...node.childNodes].map(quoteLineText).join('');if(node.nodeType===1&&/^(P|DIV|LI)$/.test(node.tagName))text+='\n';return text}
